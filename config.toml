version = 25

[platforms]
[platforms.linux]
arch = ["arm64", "x86_64"]

[platforms.darwin]
arch = ["arm64", "x86_64"]

[platforms.win32]
arch = ["x86_64"]

[sources]
[sources.xpack]
url = "https://github.com/xpack-dev-tools/{name}-xpack/releases/download/v{version}/xpack-{name}-{version}-{platform}-{arch}.{ext}"
checksum_url = "{url}.sha"
ext.default = "tar.gz"
ext.win32 = "zip"
arch.x86_64 = "x64"

[sources.python-build-standalone]
url = "https://github.com/astral-sh/python-build-standalone/releases/download/{date}/cpython-{version}+{date}-{arch}-{platform}-install_only.{ext}"
checksum_url = "{url}.sha256"
ext.default = "tar.gz"
arch.arm64 = "aarch64"
platform.darwin = "apple-darwin"
platform.linux = "unknown-linux-gnu"
platform.win32 = "pc-windows-msvc-shared"

[sources.clang-tools-static-binaries]
url = "https://github.com/muttleyxd/clang-tools-static-binaries/releases/latest/download/{name}-{version}_{platform}-{arch}{ext}"
checksum_type = "sha512"
checksum_url = "{url_no_ext}.sha512sum"
ext.default = ""
ext.win32 = ".exe"
platform.darwin = "macosx"
platform.win32 = "windows"
arch.arm64 = "amd64" # until https://github.com/muttleyxd/clang-tools-static-binaries/pull/54 is merged
arch.x86_64 = "amd64"

[sources.rust]
url = "https://static.rust-lang.org/rustup/archive/{version}/{arch}-{platform}/{name}{ext}"
checksum_url = "{url}.sha256"
ext.default = ""
ext.win32 = ".exe"
arch.arm64 = "aarch64"
platform.linux = "unknown-linux-gnu"
platform.darwin = "apple-darwin"
platform.win32 = "pc-windows-msvc"

# Official CMake builds straight from Kitware (upstream), current where xpack lags.
# Split per-platform because arm64 is spelled differently (linux "aarch64" vs
# windows "arm64") and macOS ships one universal app bundle, not per-arch assets.
# All three verify against the single combined cmake-{version}-SHA-256.txt manifest.
[sources.cmake-linux]
url = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}-linux-{arch}.{ext}"
checksum_url = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}-SHA-256.txt"
ext.default = "tar.gz"
arch.arm64 = "aarch64"

[sources.cmake-macos]
url = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}-macos-universal.{ext}"
checksum_url = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}-SHA-256.txt"
ext.default = "tar.gz"
# macOS is an app bundle; lift CMake.app/Contents/* to bin/, share/, … so the
# layout matches Linux/Windows (cmake/bin/cmake).
bundle_subdir = "CMake.app/Contents"

[sources.cmake-windows]
url = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}-windows-{arch}.{ext}"
checksum_url = "https://github.com/Kitware/CMake/releases/download/v{version}/cmake-{version}-SHA-256.txt"
ext.default = "zip"


[packages]
# Upstream Kitware builds (xpack was stale). macOS resolves via the cmake-macos
# app-bundle remap. Historically watch for Windows subprocess breakage from DBT
# (previously forced a 3.27.9-1 pin under xpack).
cmake = { version = "4.3.3", source = { linux = "cmake-linux", darwin = "cmake-macos", win32 = "cmake-windows" } }
openocd = { version = "0.12.0-4", source = "xpack" }
ninja-build = { version = "1.11.1-3", source = "xpack" }
arm-none-eabi-gcc = { version = "15.2.1-1.1", source = "xpack" }

clang-format = { version = "19", source = "clang-tools-static-binaries", set-executable = true }
#clang-tidy = { version = "19", source = "clang-tools-static-binaries" }

# rustup bootstrapper; DBT runs this to install DelugeFirmware's pinned nightly.
# See docs/superpowers/specs/2026-07-04-rust-rustup-toolchain-design.md
rustup-init = { version = "1.28.2", source = "rust", set-executable = true }

# pinned to this until python-rtmidi updates their precompiled binaries at https://pypi.org/project/python-rtmidi/#files
python = { version = "3.12.8", date="20250106", source = "python-build-standalone" }
